<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <!-- Inlined so it applies before styles.css loads, avoiding a flash of unstyled content. -->
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found"]) {
        display: none !important;
      }
    </style>
    <title>outer-spatial-reasoning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header>
      <h1>Outer Spatial Reasoning</h1>
      <button
        type="button"
        id="now-toggle"
        class="now"
        aria-expanded="false"
        aria-controls="datebar"
      >
        <svg id="phase-icon" viewBox="0 0 100 100" role="img" aria-label="Current moon phase">
          <circle cx="50" cy="50" r="46" fill="#151c2c" stroke="#2c3858" stroke-width="3" />
          <path id="phase-lit" fill="#ece7d6" />
          <circle cx="50" cy="50" r="46" fill="none" stroke="#2c3858" stroke-width="3" />
        </svg>
        <span id="r-time"></span>
      </button>
    </header>

    <div id="stage">
      <canvas
        id="gl"
        tabindex="0"
        aria-label="3D view of the solar system: the Sun, all eight planets, and Earth's Moon, each orbiting at their real relative speed. Drag to rotate, scroll or pinch to zoom, arrow keys also rotate. The Moon/Sun/Phases buttons switch between viewing from Earth and a close-up of the Moon; the Orrery button pulls back to a wide view of every planet's orbit."
      ></canvas>
      <div id="loading">Building Earth…</div>
      <div class="phase-info" id="phase-info" hidden>
        <p class="phase-name" id="phase-name"></p>
        <p class="phase-percent" id="phase-percent"></p>
        <p class="phase-note">
          The Moon doesn't change shape -- its near side always faces Earth. A phase is just how
          much of that near side the Sun happens to be lighting from this angle as the Moon orbits.
        </p>
      </div>
    </div>

    <div class="controls">
      <div class="viewgroup" role="group" aria-label="Camera view">
        <button id="view-moon" type="button" aria-pressed="true">Moon</button>
        <button id="view-sun" type="button" aria-pressed="false">Sun</button>
        <button id="view-phases" type="button" aria-pressed="false">Phases</button>
        <button id="view-orrery" type="button" aria-pressed="false">Orrery</button>
        <button id="view-custom" type="button" aria-pressed="false" disabled>Custom</button>
      </div>
      <button id="play" type="button">Pause</button>
      <select id="speed" aria-label="Playback speed">
        <option value="1" selected>Real time</option>
        <option value="3600">1 hour / sec</option>
      </select>
    </div>

    <div class="datebar" id="datebar" hidden>
      <label for="when">Boston time</label>
      <button id="d-minus" type="button" aria-label="Back one day">−1 day</button>
      <input id="when" type="datetime-local" min="1900-01-01T00:00" max="2100-12-31T23:59" />
      <button id="d-plus" type="button" aria-label="Forward one day">+1 day</button>
      <button id="d-now" type="button">Now</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
