<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <!-- Inlined so it applies before styles.css loads, avoiding a flash of unstyled content. -->
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found"]) {
        display: none !important;
      }
    </style>
    <title>outer-spatial-reasoning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header>
      <h1>Outer Spatial Reasoning</h1>
      <p class="hint">Drag to rotate · pinch or scroll to zoom</p>
    </header>

    <div id="stage">
      <canvas
        id="gl"
        tabindex="0"
        aria-label="3D view of the Sun, Earth and Moon. Drag to rotate, scroll or pinch to zoom, arrow keys also rotate."
      ></canvas>
      <div id="loading">Building Earth…</div>
    </div>

    <div class="controls">
      <button id="play" type="button">Pause</button>
      <select id="speed" aria-label="Playback speed">
        <option value="1" selected>Real time</option>
        <option value="3600">1 hour / sec</option>
      </select>
      <button id="datebtn" type="button" aria-pressed="false" hidden>Date</button>
    </div>

    <div class="datebar" id="datebar" hidden>
      <label for="when">Boston time</label>
      <button id="d-minus" type="button" aria-label="Back one day">−1 day</button>
      <input id="when" type="datetime-local" min="1900-01-01T00:00" max="2100-12-31T23:59" />
      <button id="d-plus" type="button" aria-label="Forward one day">+1 day</button>
      <button id="d-now" type="button">Now</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
